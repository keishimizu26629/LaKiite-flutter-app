name: "[Release] Dev iOS"

on:
  workflow_dispatch:
    inputs:
      clean_ios_cache:
        description: "Clean Pods, Podfile.lock, and Xcode DerivedData before building"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    environment: dev

    steps:
      - uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0

      - name: Check Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          echo "Using default Xcode for iOS 26 SDK upload compliance"

      - name: Restore Firebase config files
        run: |
          mkdir -p ios/Runner/Firebase/Dev
          echo "${{ secrets.DEV_GOOGLESERVICE_INFO_PLIST_BASE64 }}" | base64 -d > ios/Runner/Firebase/Dev/GoogleService-Info.plist
          cp ios/Runner/Firebase/Dev/GoogleService-Info.plist ios/Runner/GoogleService-Info.plist
          echo "${{ secrets.DEV_FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart

      - name: Setup CI
        uses: ./.github/actions/setup
        with:
          flutter-cache: "true"

      - name: Restore CocoaPods cache
        if: ${{ !inputs.clean_ios_cache }}
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Restore dart-define config
        run: |
          echo "${{ secrets.DEV_DART_DEFINE_JSON_BASE64 }}" | base64 -d > dart_define/dev_dart_define.json

      - name: Restore Airbridge config
        run: |
          cat > ios/Flutter/Airbridge.local.xcconfig <<EOF
          AIRBRIDGE_DEV_APP_NAME = ${{ secrets.AIRBRIDGE_DEV_APP_NAME }}
          AIRBRIDGE_DEV_SDK_TOKEN = ${{ secrets.AIRBRIDGE_DEV_SDK_TOKEN }}
          AIRBRIDGE_PROD_APP_NAME = ${{ secrets.AIRBRIDGE_PROD_APP_NAME }}
          AIRBRIDGE_PROD_SDK_TOKEN = ${{ secrets.AIRBRIDGE_PROD_SDK_TOKEN }}
          EOF

      - name: Setup temporary keychain
        run: |
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

      - name: Import Provisioning Profile
        run: |
          echo "${{ secrets.DEV_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Import Code-Signing Certificate
        run: |
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 -d > certificates.p12
          security import certificates.p12 -k build.keychain -P "${{ secrets.CERT_PWD }}" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: List available certificates
        run: |
          security find-identity -v -p codesigning
          xcodebuild -version

      - name: Prepare iOS build cache
        run: |
          cd ios
          if [ "${{ inputs.clean_ios_cache }}" = "true" ]; then
            rm -rf Pods
            rm -rf Podfile.lock
            rm -rf build
            rm -rf ~/Library/Developer/Xcode/DerivedData/*
            echo "Cleaned iOS dependency and build caches for fresh dependency resolution"
          else
            rm -rf build
            echo "Keeping Pods and Podfile.lock so dependency caches can be reused"
          fi

      - name: Prepare Xcode build settings for Distribution
        run: |
          cp ios/DevExportOptions.plist ios/ExportOptions.plist

          xcodebuild -project ios/Runner.xcodeproj \
            -scheme dev \
            -configuration Release-dev \
            -showBuildSettings | grep -E "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER"

      - name: Calculate Build Number
        id: calculate_build_number
        run: |
          echo "buildNumber=$(date +%s)" >> $GITHUB_OUTPUT

      - name: flutter build ipa
        run: |
          flutter build ipa --release \
            --flavor dev \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define-from-file="dart_define/dev_dart_define.json" \
            -t "lib/main.dart" \
            --build-number="${{ steps.calculate_build_number.outputs.buildNumber }}"

      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p private_keys
          echo "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 -d > "private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Upload to TestFlight
        run: |
          IPA_FILE=$(ls ./build/ios/ipa/*.ipa)
          xcrun altool --upload-app \
            -t ios \
            -f "$IPA_FILE" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Debug build settings on failure
        if: failure()
        run: |
          echo "=== Xcode Build Settings Debug ==="
          xcodebuild -showBuildSettings -workspace ios/Runner.xcworkspace -scheme dev -configuration Release-dev | tail -n 80 || true
          echo "=== Build Logs Directory ==="
          ls -la build/ios/ipa/ ios/build/ || true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            ios/build/logs/
          retention-days: 7
