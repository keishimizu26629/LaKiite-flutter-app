name: '[Diagnose] Dev Firebase Auth'

on:
  push:
    branches:
      - diagnose/dev-firebase-auth-from-airbridge

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        firebase_tools:
          - 13.35.1
          - 14.27.0
          - 15.0.0
          - 15.8.0
          - 15.22.2

    steps:
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@${{ matrix.firebase_tools }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Diagnose Firebase service account auth with firebase-tools ${{ matrix.firebase_tools }}
        env:
          DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          DEV_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          echo "$DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 -d > /tmp/dev_firebase_service_account_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/dev_firebase_service_account_key.json

          if [ ! -s "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "::error ::Decoded Firebase service account is empty. Check DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64."
            exit 1
          fi

          echo "Firebase CLI version: $(firebase --version)"
          echo "gcloud version: $(gcloud version --format='value(Google Cloud SDK)' 2>/dev/null || true)"
          jq -r '"service_account_email=\(.client_email)\nservice_account_project_id=\(.project_id)\nservice_account_key_id_prefix=\(.private_key_id[0:6])***"' "$GOOGLE_APPLICATION_CREDENTIALS"

          echo "::group::firebase apps:list with GOOGLE_APPLICATION_CREDENTIALS"
          set +e
          firebase apps:list --project "$DEV_FIREBASE_PROJECT_ID"
          firebase_apps_gac_status=$?
          set -e
          echo "firebase_apps_gac_status=$firebase_apps_gac_status"
          echo "::endgroup::"

          echo "::group::firebase appdistribution:groups:list with GOOGLE_APPLICATION_CREDENTIALS"
          set +e
          firebase appdistribution:groups:list --project "$DEV_FIREBASE_PROJECT_ID"
          firebase_groups_gac_status=$?
          set -e
          echo "firebase_groups_gac_status=$firebase_groups_gac_status"
          echo "::endgroup::"

          echo "::group::firebase apps:list with ADC default path"
          mkdir -p "$HOME/.config/gcloud"
          cp "$GOOGLE_APPLICATION_CREDENTIALS" "$HOME/.config/gcloud/application_default_credentials.json"
          unset GOOGLE_APPLICATION_CREDENTIALS
          set +e
          firebase apps:list --project "$DEV_FIREBASE_PROJECT_ID"
          firebase_apps_adc_status=$?
          set -e
          echo "firebase_apps_adc_status=$firebase_apps_adc_status"
          echo "::endgroup::"

          echo "::group::firebase appdistribution:groups:list with ADC default path"
          set +e
          firebase appdistribution:groups:list --project "$DEV_FIREBASE_PROJECT_ID"
          firebase_groups_adc_status=$?
          set -e
          echo "firebase_groups_adc_status=$firebase_groups_adc_status"
          echo "::endgroup::"

          if [ "$firebase_apps_gac_status" -ne 0 ] || [ "$firebase_groups_gac_status" -ne 0 ]; then
            if [ "$firebase_apps_adc_status" -ne 0 ] || [ "$firebase_groups_adc_status" -ne 0 ]; then
              echo "::error ::Firebase CLI auth failed with both GOOGLE_APPLICATION_CREDENTIALS and ADC."
              exit 1
            fi
          fi

          if [ "$firebase_apps_gac_status" -eq 0 ] && [ "$firebase_groups_gac_status" -eq 0 ]; then
            echo "firebase_auth_result=success_with_google_application_credentials"
          elif [ "$firebase_apps_adc_status" -eq 0 ] && [ "$firebase_groups_adc_status" -eq 0 ]; then
            echo "firebase_auth_result=success_with_adc"
          else
            echo "::error ::Unexpected auth status combination."
            exit 1
          fi
