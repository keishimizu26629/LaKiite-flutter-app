name: '[Diagnose] Dev Firebase Auth'

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev

    steps:
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.22.2

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Diagnose Firebase service account auth
        env:
          DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          DEV_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          echo "$DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 -d > /tmp/dev_firebase_service_account_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/dev_firebase_service_account_key.json

          if [ ! -s "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "::error ::Decoded Firebase service account is empty. Check DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64."
            exit 1
          fi

          echo "Firebase CLI version: $(firebase --version)"
          echo "gcloud version: $(gcloud version --format='value(Google Cloud SDK)' 2>/dev/null || true)"
          jq -r '"service_account_email=\(.client_email)\nservice_account_project_id=\(.project_id)\nservice_account_key_id_prefix=\(.private_key_id[0:6])***"' "$GOOGLE_APPLICATION_CREDENTIALS"

          echo "::group::firebase apps:list with GOOGLE_APPLICATION_CREDENTIALS only"
          set +e
          firebase apps:list --project "$DEV_FIREBASE_PROJECT_ID"
          firebase_apps_before_status=$?
          set -e
          echo "firebase_apps_before_status=$firebase_apps_before_status"
          echo "::endgroup::"

          echo "::group::gcloud activate-service-account"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project "$DEV_FIREBASE_PROJECT_ID"
          gcloud auth list --format='table(account,status)'
          gcloud projects describe "$DEV_FIREBASE_PROJECT_ID" --format='value(projectId,lifecycleState)'
          if [ -n "$(gcloud auth print-access-token)" ]; then
            echo "gcloud_access_token=present"
          else
            echo "::error ::gcloud access token is empty"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::firebase apps:list after gcloud auth"
          set +e
          firebase apps:list --project "$DEV_FIREBASE_PROJECT_ID"
          firebase_apps_after_status=$?
          set -e
          echo "firebase_apps_after_status=$firebase_apps_after_status"
          echo "::endgroup::"

          echo "::group::firebase appdistribution:groups:list after gcloud auth"
          set +e
          firebase appdistribution:groups:list --project "$DEV_FIREBASE_PROJECT_ID"
          firebase_groups_after_status=$?
          set -e
          echo "firebase_groups_after_status=$firebase_groups_after_status"
          echo "::endgroup::"

          if [ "$firebase_apps_after_status" -ne 0 ] || [ "$firebase_groups_after_status" -ne 0 ]; then
            echo "::error ::Firebase CLI auth failed with the restored service account."
            exit 1
          fi
