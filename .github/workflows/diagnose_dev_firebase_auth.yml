name: '[Diagnose] Dev Firebase Auth'

on:
  push:
    branches:
      - diagnose/dev-firebase-auth-from-airbridge

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare service account credentials JSON
        id: firebase_credentials
        env:
          DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
        run: |
          set -euo pipefail

          credentials_json="$(echo "$DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 -d | jq -c .)"
          if [ -z "$credentials_json" ]; then
            echo "::error ::Decoded Firebase service account JSON is empty."
            exit 1
          fi

          echo "::add-mask::$credentials_json"
          printf 'credentials_json=%s\n' "$credentials_json" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ steps.firebase_credentials.outputs.credentials_json }}
          project_id: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.22.2

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Diagnose Firebase service account auth with google-github-actions/auth
        env:
          DEV_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ ! -s "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "::error ::google-github-actions/auth did not create a credentials file."
            exit 1
          fi

          echo "Firebase CLI version: $(firebase --version)"
          echo "gcloud version: $(gcloud version --format='value(Google Cloud SDK)' 2>/dev/null || true)"
          echo "google_application_credentials=present"
          echo "google_cloud_project=${GOOGLE_CLOUD_PROJECT:-unset}"
          jq -r '"service_account_email=\(.client_email)\nservice_account_project_id=\(.project_id)\nservice_account_key_id_prefix=\(.private_key_id[0:6])***"' "$GOOGLE_APPLICATION_CREDENTIALS"

          echo "::group::gcloud auth check"
          gcloud auth list --format='table(account,status)'
          gcloud projects describe "$DEV_FIREBASE_PROJECT_ID" --format='value(projectId,lifecycleState)'
          echo "::endgroup::"

          echo "::group::firebase apps:list with auth action credentials"
          firebase apps:list --project "$DEV_FIREBASE_PROJECT_ID"
          echo "::endgroup::"

          echo "::group::firebase appdistribution:groups:list with auth action credentials"
          firebase appdistribution:groups:list --project "$DEV_FIREBASE_PROJECT_ID"
          echo "::endgroup::"

          echo "firebase_auth_result=success_with_google_github_actions_auth"
