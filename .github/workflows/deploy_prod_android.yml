name: '[Release] Prod Android'

on:
  workflow_run:
    workflows: ["Release Drafter"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "Successful main-push Release Drafter run ID (with release-manifest)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod

    steps:
      - uses: actions/checkout@v5.0.1

      - name: Verify release source run
        id: release_source
        uses: ./.github/actions/prepare-release-source
        with:
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}

      - name: Checkout verified release source
        uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.release_source.outputs.sha }}

      - name: Resolve release version
        id: release_version
        uses: ./.github/actions/resolve-release-version
        with:
          run-id: ${{ steps.release_source.outputs.run_id }}

      - name: Setup CI
        uses: ./.github/actions/setup

      - name: Setup Node for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.22.2

      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses and install NDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;28.0.12674087"

      - name: Restore Firebase config files
        run: |
          mkdir -p android/app/src/prod
          echo "${{ secrets.PROD_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/src/prod/google-services.json
          echo "${{ secrets.PROD_GOOGLESERVICE_INFO_PLIST_BASE64 }}" | base64 -d > ios/Runner/GoogleService-Info-Prod.plist
          echo "${{ secrets.PROD_FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart

      - name: Validate Android signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_JKS_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_UPLOAD_KEYSTORE_JKS_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error ::Missing required secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Restore Android signing keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_JKS_BASE64 }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_JKS_BASE64" | base64 -d > android/upload-keystore.jks
          if [ ! -s android/upload-keystore.jks ]; then
            echo "::error ::Decoded keystore is empty. Check ANDROID_UPLOAD_KEYSTORE_JKS_BASE64."
            exit 1
          fi

      - name: Create Android key.properties
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Restore dart-define config
        run: |
          echo "${{ secrets.PROD_DART_DEFINE_JSON_BASE64 }}" | base64 -d > dart_define.json

      - name: Validate prod runtime config
        run: |
          set -euo pipefail

          flavor="$(jq -r '.FLAVOR // empty' dart_define.json)"
          app_name="$(jq -r '.APP_NAME // empty' dart_define.json)"
          test_mode="$(jq -r 'has("TEST_MODE")' dart_define.json)"
          emulator_mode="$(jq -r 'has("USE_FIREBASE_EMULATOR")' dart_define.json)"

          if [ "$flavor" != "production" ]; then
            echo "::error ::PROD_DART_DEFINE_JSON_BASE64 must set FLAVOR=production."
            exit 1
          fi

          if [ "$app_name" != "LaKiite" ]; then
            echo "::error ::PROD_DART_DEFINE_JSON_BASE64 must set APP_NAME=LaKiite."
            exit 1
          fi

          if [ "$test_mode" != "false" ]; then
            echo "::error ::PROD_DART_DEFINE_JSON_BASE64 must not include TEST_MODE."
            exit 1
          fi

          if [ "$emulator_mode" != "false" ]; then
            echo "::error ::PROD_DART_DEFINE_JSON_BASE64 must not include USE_FIREBASE_EMULATOR."
            exit 1
          fi

          if ! grep -q "com.inoworl.lakiite" lib/firebase_options.dart; then
            echo "::error ::PROD_FIREBASE_OPTIONS_DART_BASE64 must include the prod Android/iOS app id."
            exit 1
          fi

          if ! grep -q "lakiite-flutter-app-prod" lib/firebase_options.dart; then
            echo "::error ::PROD_FIREBASE_OPTIONS_DART_BASE64 must include the prod Firebase project id."
            exit 1
          fi

          echo "Prod runtime config validation passed."

      - name: Calculate Build Number
        id: calculate_build_number
        run: |
          BUILD_NUMBER=$(date +%s)
          echo "buildNumber=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: flutter build appbundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          AIRBRIDGE_PROD_APP_NAME: ${{ secrets.AIRBRIDGE_PROD_APP_NAME }}
          AIRBRIDGE_PROD_SDK_TOKEN: ${{ secrets.AIRBRIDGE_PROD_SDK_TOKEN }}
        run: |
          flutter build appbundle --release \
            --flavor prod \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define-from-file="dart_define.json" \
            -t "lib/main.dart" \
            --build-name="${{ steps.release_version.outputs.version }}" \
            --build-number="${{ steps.calculate_build_number.outputs.buildNumber }}"

      - name: flutter build apk
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          AIRBRIDGE_PROD_APP_NAME: ${{ secrets.AIRBRIDGE_PROD_APP_NAME }}
          AIRBRIDGE_PROD_SDK_TOKEN: ${{ secrets.AIRBRIDGE_PROD_SDK_TOKEN }}
        run: |
          flutter build apk --release \
            --flavor prod \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define-from-file="dart_define.json" \
            -t "lib/main.dart" \
            --build-name="${{ steps.release_version.outputs.version }}" \
            --build-number="${{ steps.calculate_build_number.outputs.buildNumber }}"

      - name: Verify built release metadata
        env:
          RELEASE_RUN_ID: ${{ steps.release_source.outputs.run_id }}
          EXPECTED_BUILD_NUMBER: ${{ steps.calculate_build_number.outputs.buildNumber }}
        run: |
          set -euo pipefail
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl --fail --location --retry 3 -o "$bundletool" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          printf 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  %s\n' "$bundletool" | sha256sum --check -
          python3 scripts/verify_release_artifact.py build/app/outputs/bundle/prodRelease/app-prod-release.aab --bundletool "$bundletool" > .release/aab-metadata.json
          node scripts/release_manifest.mjs verify-build .release/aab-metadata.json
          python3 scripts/verify_release_artifact.py build/app/outputs/flutter-apk/app-prod-release.apk --apkanalyzer "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" > .release/apk-metadata.json
          node scripts/release_manifest.mjs verify-build .release/apk-metadata.json

      - name: Save verified Android release evidence
        uses: actions/upload-artifact@v4
        with:
          name: verified-android-release-${{ github.run_attempt }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error

      - name: Decode Google Play Console API Service Account Key
        run: echo "${{ secrets.GOOGLE_PLAY_CONSOLE_API_SERVICE_ACCOUNT_KEY_JSON_BASE64 }}" | base64 --decode > /tmp/google_play_console_api_service_account_key.json

      - name: Deploy to Play Store (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/google_play_console_api_service_account_key.json
          packageName: ${{ secrets.PROD_ANDROID_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: .release/play

      - name: Prepare Firebase App Distribution credentials
        id: firebase_app_distribution_credentials
        env:
          PROD_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
        run: |
          set -euo pipefail

          credentials_json="$(echo "$PROD_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 -d | jq -c .)"
          if [ -z "$credentials_json" ]; then
            echo "::error ::Decoded Firebase service account JSON is empty."
            exit 1
          fi

          echo "::add-mask::$credentials_json"
          printf 'credentials_json=%s\n' "$credentials_json" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud for Firebase App Distribution
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ steps.firebase_app_distribution_credentials.outputs.credentials_json }}
          project_id: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud for Firebase App Distribution
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Firebase App Distribution
        env:
          PROD_FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          PROD_FIREBASE_ANDROID_APP_ID: ${{ secrets.PROD_FIREBASE_ANDROID_APP_ID }}
        run: |
          firebase appdistribution:distribute ./build/app/outputs/flutter-apk/app-prod-release.apk \
            --project "$PROD_FIREBASE_PROJECT_ID" \
            --app "$PROD_FIREBASE_ANDROID_APP_ID" \
            --groups internal-testers  \
            --release-notes-file .release/play/ja-JP.txt
