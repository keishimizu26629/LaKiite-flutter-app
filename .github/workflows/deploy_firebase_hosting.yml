name: '[Release] Firebase Hosting'

on:
  push:
    branches: [dev, main]
    paths:
      - 'web/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy_firebase_hosting.yml'
      - 'scripts/prepare_hosting.mjs'
      - 'scripts/test_hosting_seo.mjs'
      - 'scripts/test_web_landing.mjs'
      - 'scripts/test_store_marketing.mjs'
  workflow_dispatch:
    inputs:
      target:
        description: 'Firebase project alias'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Reject production requests outside main
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = prod ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Production Hosting must be published from main.' >&2
            exit 1
          fi
      - name: Validate landing page and Hosting contracts
        run: node --test scripts/test_web_landing.mjs scripts/test_store_marketing.mjs scripts/test_hosting_seo.mjs

  deploy-dev:
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev

    steps:
      - uses: actions/checkout@v5.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Prepare dev Hosting artifact
        id: prepare
        run: |
          hosting_config=$(node scripts/prepare_hosting.mjs --target dev)
          printf 'config=%s\n' "$hosting_config" >> "$GITHUB_OUTPUT"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Restore Firebase service account
        run: |
          echo "${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}" | base64 -d > /tmp/firebase-service-account.json

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
        run: |
          firebase deploy \
            --only hosting \
            --config "${{ steps.prepare.outputs.config }}" \
            --project "${{ secrets.DEV_FIREBASE_PROJECT_ID }}"

  deploy-prod:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod

    steps:
      - uses: actions/checkout@v5.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Prepare prod Hosting artifact
        id: prepare
        run: |
          hosting_config=$(node scripts/prepare_hosting.mjs --target prod)
          printf 'config=%s\n' "$hosting_config" >> "$GITHUB_OUTPUT"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Restore Firebase service account
        run: |
          echo "${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}" | base64 -d > /tmp/firebase-service-account.json

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
        run: |
          firebase deploy \
            --only hosting \
            --config "${{ steps.prepare.outputs.config }}" \
            --project "${{ secrets.PROD_FIREBASE_PROJECT_ID }}"
