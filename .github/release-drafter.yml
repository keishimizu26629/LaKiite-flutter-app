name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
tag-prefix: "v"
version-template: "$MAJOR.$MINOR.$PATCH"
commitish: "main"
filter-by-commitish: true
exclude-labels:
  - "skip-changelog"
  - "semver:none"

categories:
  - title: "Breaking Changes"
    labels:
      - "breaking-change"

  - title: "Features"
    labels:
      - "type:feature"
      - "enhancement"
      - "1 : ストーリー - story"

  - title: "Fixes"
    labels:
      - "type:fix"
      - "3 : バグ - bug"

  - title: "Security"
    labels:
      - "type:security"

  - title: "Performance"
    labels:
      - "type:performance"

  - title: "Refactoring"
    labels:
      - "type:refactor"

  - title: "Tests"
    labels:
      - "type:test"

  - title: "Documentation"
    labels:
      - "type:docs"
      - "0 : 書類 - documentation"

  - title: "CI and Maintenance"
    labels:
      - "type:ci"
      - "type:chore"
      - "環境構築"

  - title: "Other Changes"

version-resolver:
  major:
    labels:
      - "semver:major"
      - "breaking-change"
  minor:
    labels:
      - "semver:minor"
      - "type:feature"
      - "enhancement"
      - "1 : ストーリー - story"
  patch:
    labels:
      - "semver:patch"
  default: patch

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&`#@'
no-changes-template: "- No user-facing changes"

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

autolabeler:
  - label: "type:ci"
    files:
      - ".github/**"
    branch:
      - "/^(ci|chore)\\//"
    title:
      - "/\\b(ci|workflow|actions?)\\b/i"

  - label: "type:docs"
    files:
      - "**/*.md"
      - "docs/**"
    branch:
      - "/^docs?\\//"

  - label: "type:fix"
    title:
      - "/\\b(fix|bug|不具合|修正)\\b/i"

  - label: "type:feature"
    title:
      - "/\\b(feat|feature|追加|実装)\\b/i"
