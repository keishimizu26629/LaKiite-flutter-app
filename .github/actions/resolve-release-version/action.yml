name: Resolve Release Version
description: Read the immutable upstream release snapshot without recalculating its version.
inputs:
  run-id:
    description: Verified Release Drafter run ID.
    required: true
outputs:
  version:
    description: Frozen app version.
    value: ${{ steps.snapshot.outputs.version }}
  tag:
    description: Frozen release tag.
    value: ${{ steps.snapshot.outputs.tag }}
  release_id:
    description: Release ID recorded by the parent run.
    value: ${{ steps.snapshot.outputs.release_id }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: release-manifest
        path: .release-input
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
    - name: Validate frozen snapshot and render platform notes
      id: snapshot
      shell: bash
      env:
        RELEASE_RUN_ID: ${{ inputs.run-id }}
      run: node scripts/release_manifest.mjs load .release-input/release-manifest.json
